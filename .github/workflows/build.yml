name: build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig file to start from"
        required: false
        default: defconfig/c2000-ultra.config

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            gcc-multilib g++-multilib libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget \
            subversion time squashfs-tools patch bc openssl
          gcc --version | head -1

      - name: Move tree to the large disk
        id: space
        run: |
          best=""; best_kb=0
          for m in /mnt /home /var/tmp /tmp /; do
            [ -d "$m" ] || continue
            kb=$(df -Pk "$m" | awk 'NR==2{print $4}')
            echo "$m -> $(( ${kb:-0} / 1024 / 1024 )) GiB free"
            if [ "${kb:-0}" -gt "$best_kb" ]; then best_kb="$kb"; best="$m"; fi
          done
          echo "chosen: $best ($(( best_kb / 1024 / 1024 )) GiB)"
          if [ $(( best_kb / 1024 / 1024 )) -lt 25 ]; then
            echo "::error::not enough free space on any mount"; exit 1
          fi
          sudo mkdir -p "$best/ywrt"
          sudo chown "$(id -u):$(id -g)" "$best/ywrt"
          rsync -a --exclude=.git ./ "$best/ywrt/src/"
          echo "base=$best/ywrt" >> "$GITHUB_OUTPUT"
          ls "$best/ywrt/src" | head

      - name: Feeds
        run: |
          cd "${{ steps.space.outputs.base }}/src"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build
        run: |
          BASE="${{ steps.space.outputs.base }}"
          cd "$BASE/src"
          CFG="${{ inputs.defconfig }}"
          [ -n "$CFG" ] || CFG=defconfig/c2000-ultra.config
          cp "$CFG" .config
          set +e
          ./build.sh 2>&1 | tee "$BASE/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "build rc=$rc"
          exit $rc

      - name: Summary
        if: always()
        run: |
          BASE="${{ steps.space.outputs.base }}"
          BASE="${BASE:-/mnt/ywrt}"
          {
            echo "## result"
            if [ -f "$BASE/build.log" ]; then
              echo '### errors'
              echo '```'
              grep -nE "Error [0-9]|ERROR:|No space left|error:|Hash mismatch|No such file" "$BASE/build.log" | tail -n 60 || echo "(none)"
              echo '```'
              echo '### tail'
              echo '```'
              tail -n 120 "$BASE/build.log"
              echo '```'
            else
              echo "build did not start"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish log on failure
        if: failure()
        run: |
          BASE="${{ steps.space.outputs.base }}"
          BASE="${BASE:-/mnt/ywrt}"
          mkdir -p "$RUNNER_TEMP/ci-log" && cd "$RUNNER_TEMP/ci-log"
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          {
            echo "# failed run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo
            echo "## errors"
            grep -nE "Error [0-9]|ERROR:|No space left|error:|Hash mismatch|No such file|failed to build" "$BASE/build.log" 2>/dev/null | tail -n 150 || true
            echo
            echo "## tail 800"
            tail -n 800 "$BASE/build.log" 2>/dev/null || echo "(no build.log)"
          } > ci-log.txt
          git add ci-log.txt
          git commit -q -m "ci log $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            ${{ steps.space.outputs.base }}/src/bin/targets/**/*.tar
            ${{ steps.space.outputs.base }}/build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
