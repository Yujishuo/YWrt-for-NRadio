name: build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig file to start from"
        required: false
        default: defconfig/c2000-ultra.config

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            gcc-multilib g++-multilib libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget \
            subversion time squashfs-tools patch bc openssl
          gcc --version | head -1

      - name: Move tree to the large disk
        id: space
        run: |
          best=""; best_kb=0
          for m in /mnt /home /var/tmp /tmp /; do
            [ -d "$m" ] || continue
            kb=$(df -Pk "$m" | awk 'NR==2{print $4}')
            echo "$m -> $(( ${kb:-0} / 1024 / 1024 )) GiB free"
            if [ "${kb:-0}" -gt "$best_kb" ]; then best_kb="$kb"; best="$m"; fi
          done
          echo "chosen: $best ($(( best_kb / 1024 / 1024 )) GiB)"
          if [ $(( best_kb / 1024 / 1024 )) -lt 25 ]; then
            echo "::error::not enough free space on any mount"; exit 1
          fi
          sudo mkdir -p "$best/ywrt"
          sudo chown "$(id -u):$(id -g)" "$best/ywrt"
          rsync -a ./ "$best/ywrt/src/"
          echo "base=$best/ywrt" >> "$GITHUB_OUTPUT"
          echo "--- tree revision seen by getver.sh ---"
          ( cd "$best/ywrt/src" && ./scripts/getver.sh )
          ls "$best/ywrt/src" | head

      - name: Feeds
        run: |
          cd "${{ steps.space.outputs.base }}/src"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Preflight the config
        run: |
          set +e
          BASE="${{ steps.space.outputs.base }}"
          cd "$BASE/src"
          CFG="${{ inputs.defconfig }}"
          [ -n "$CFG" ] || CFG=defconfig/c2000-ultra.config
          cp "$CFG" .config
          {
            echo "## defconfig run"
            make defconfig
            echo "defconfig rc=$?"
            echo
            echo "## switches"
            grep -E '^CONFIG_(USE_APK|SIGNED_PACKAGES|BUILDBOT|IB|ALL|PER_PACKAGE_DIRS|AUTOREMOVE|CCACHE|CLEAN_IPKG)=' .config
            echo "y-count: $(grep -c '=y$' .config)  total: $(wc -l < .config)"
            echo
            echo "## target"
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH_PACKAGES)=' .config
            sed -n 's/^CONFIG_TARGET_DEVICE_[^=]*_DEVICE_\(.*\)=y$/  device: \1/p' .config
            echo
            echo "## git metadata in the build tree"
            ls -d .git 2>&1
            echo
            echo "## keys"
            ls -l private-key.pem public-key.pem 2>&1
          } > "$BASE/preflight.log" 2>&1
          cat "$BASE/preflight.log"
          exit 0

      - name: Build
        run: |
          BASE="${{ steps.space.outputs.base }}"
          cd "$BASE/src"
          set +e
          ./build.sh > "$BASE/build.log" 2>&1
          rc=$?
          set -e
          echo "build rc=$rc"
          tail -n 30 "$BASE/build.log"
          exit $rc

      - name: Diagnose the failing package
        if: failure()
        run: |
          set +e
          BASE="${{ steps.space.outputs.base }}"
          cd "$BASE/src" || exit 0
          {
            echo "## environment"
            echo "-- keys --"
            ls -l private-key.pem public-key.pem
            echo "-- host tools --"
            ls -l staging_dir/host/bin/apk staging_dir/host/bin/fakeroot staging_dir/host/bin/usign staging_dir/host/bin/ucert
            echo "-- disk --"
            df -h .
            echo "-- staging dirs --"
            ls -d staging_dir/target-* build_dir/target-* 2>&1
            echo "-- base-files apk --"
            ls -l bin/packages/*/base/base-files* 2>&1
            echo "-- base-files stamps --"
            ls -l staging_dir/target-*/stamp/ 2>&1 | grep -i base-files
            echo "-- base-files build dir --"
            ls -l build_dir/target-*/base-files/ 2>&1
            echo "-- root dirs --"
            ls -ld staging_dir/target-*/root-* 2>&1
            echo
            echo "## retry 1: prepare V=sc"
            make -C package/base-files prepare V=sc
            echo "prepare rc=$?"
            echo
            echo "## retry 2: compile V=sc"
            make -C package/base-files compile V=sc
            echo "compile rc=$?"
            echo
            echo "## retry 3: top level package/base-files/compile V=sc"
            make package/base-files/compile V=sc
            echo "toplevel rc=$?"
            echo
            echo "## after retry"
            ls -l bin/packages/*/base/base-files* 2>&1
            ls -l staging_dir/target-*/stamp/ 2>&1 | grep -i base-files
            ls -l build_dir/target-*/base-files/ 2>&1 | head -20
          } > "$BASE/diag.log" 2>&1
          tail -n 150 "$BASE/diag.log"
          exit 0

      - name: Summary
        if: always()
        run: |
          set +e
          BASE="${{ steps.space.outputs.base }}"
          {
            echo "## result"
            for f in preflight.log build.log diag.log; do
              if [ -f "$BASE/$f" ]; then
                echo "### $f (last 60 lines)"
                echo '```'
                tail -n 60 "$BASE/$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish log on failure
        if: failure()
        run: |
          set +e
          BASE="${{ steps.space.outputs.base }}"
          mkdir -p "$RUNNER_TEMP/ci-log" && cd "$RUNNER_TEMP/ci-log"
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          {
            echo "# failed run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "sha: $GITHUB_SHA"
            echo
            echo "## error-like lines"
            grep -nE "Error [0-9]|ERROR:|No space left|error:|Hash mismatch|No such file|failed to build|cannot" \
              "$BASE/build.log" 2>/dev/null | tail -n 200
            echo
            echo "## context before the first failure"
            L=$(grep -n "ERROR: .* failed to build" "$BASE/build.log" 2>/dev/null | head -1 | cut -d: -f1)
            if [ -n "${L:-}" ]; then
              s=$(( L > 200 ? L - 200 : 1 ))
              sed -n "${s},$(( L + 20 ))p" "$BASE/build.log"
            else
              echo "(no 'failed to build' line)"
            fi
            echo
            echo "## preflight"
            cat "$BASE/preflight.log" 2>/dev/null
            echo
            echo "## diagnose (verbose retry)"
            cat "$BASE/diag.log" 2>/dev/null
            echo
            echo "## full build.log"
            echo "lines: $(wc -l < "$BASE/build.log" 2>/dev/null)"
            cat "$BASE/build.log" 2>/dev/null
          } > ci-log.txt 2>&1
          wc -l ci-log.txt
          git add ci-log.txt
          git commit -q -m "ci log $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            ${{ steps.space.outputs.base }}/src/bin/targets/**/*.tar
            ${{ steps.space.outputs.base }}/build.log
            ${{ steps.space.outputs.base }}/diag.log
            ${{ steps.space.outputs.base }}/preflight.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
